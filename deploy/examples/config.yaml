serve-path: /data
bind: 0.0.0.0
port: 5000
allow-all: false
allow-upload: true
allow-delete: true
allow-search: true
allow-symlink: false
allow-archive: true
allow-hash: true
hidden:
  - .git
  - .DS_Store
  - Thumbs.db
  - '*.tmp'
  - '*.part'
  - '*.lock'
log-format: '$time_local $remote_addr $remote_user "$request" $status'
log-file: /logs/dufs.log
